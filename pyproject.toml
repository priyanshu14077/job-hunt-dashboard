[project]
name = "jobdash"
version = "0.1.0"
description = "Job-hunt dashboard built from a multi-tab Google Sheet with pandas + NumPy"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobdash"]
